<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OrderFlow — Sign in</title>

    <style>
        :root {
            --dark: #0e211a;
            --green: #2f765d;
            --green-dark: #1d5a47;
            --background: #f4f7f5;
            --white: #ffffff;
            --text: #17221e;
            --muted: #71807a;
            --border: #dfe8e2;
            --error-bg: #fff1f0;
            --error-text: #a33f38;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: var(--background);
            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
            padding: 24px;
        }

        .page {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            font-size: 38px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -2px;
            color: var(--text);
        }

        .logo span {
            color: var(--green);
        }

        .tagline {
            margin-top: 10px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(23, 56, 45, 0.10);
        }

        .heading {
            margin-bottom: 26px;
        }

        .eyebrow {
            color: var(--green);
            font-size: 11px;
            font-weight: 850;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.1;
            letter-spacing: -1px;
            font-weight: 850;
        }

        .intro {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            background: var(--error-bg);
            border: 1px solid #f1cbc7;
            color: var(--error-text);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: 650;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 750;
            color: var(--text);
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 15px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: #fbfcfb;
            color: var(--text);

            font-size: 16px;
            outline: none;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease,
                background 0.15s ease;
        }

        input:focus {
            background: #ffffff;
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(47, 118, 93, 0.12);
        }

        input::placeholder {
            color: #9aa59f;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 88px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            border: 0;
            background: transparent;

            color: var(--green-dark);

            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
            padding: 8px;
        }

        .show-password:hover {
            color: var(--dark);
        }

        .submit {
            width: 100%;
            height: 54px;

            border: 0;
            border-radius: 13px;

            background: var(--dark);
            color: #ffffff;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .submit:hover {
            background: var(--green-dark);
            box-shadow: 0 8px 24px rgba(14, 33, 26, 0.18);
        }

        .submit:active {
            transform: translateY(1px);
        }

        .create-account {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 13px;
        }

        .create-account a {
            color: var(--green-dark);
            font-weight: 800;
            text-decoration: none;
        }

        .create-account a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .footer strong {
            color: var(--green-dark);
            font-weight: 800;
        }

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .card {
                padding: 24px 20px;
                border-radius: 20px;
            }

            .logo {
                font-size: 34px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="brand">

        <div class="logo">
            ORDER<span>FLOW</span>
        </div>

        <div class="tagline">
            Hospitality management, simplified.
        </div>

    </div>


    <div class="card">

        <div class="heading">

            <div class="eyebrow">
                Secure access
            </div>

            <h1>
                Welcome back
            </h1>

            <p class="intro">
                Sign in to manage your hospitality business.
            </p>

        </div>


        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}


        <form method="POST" action="/login">

            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    autocapitalize="none"
                    spellcheck="false"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="passwordToggle"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="submit"
            >
                Sign in to OrderFlow
            </button>

        </form>


        <div class="create-account">
            Don't have an account?
            <a href="/onboarding">
                Create one
            </a>
        </div>

    </div>


    <div class="footer">
        <strong>OrderFlow</strong><br>
        One platform for your entire hospitality operation.
    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const toggle =
        document.getElementById("passwordToggle");

    if (password.type === "password") {

        password.type = "text";
        toggle.textContent = "Hide";

    } else {

        password.type = "password";
        toggle.textContent = "Show";

    }
}

</script>

</body>
</html>
