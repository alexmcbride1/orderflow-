<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrderFlow</title>

<style>
body{
    margin:0;
    background:#f4f7f5;
    color:#17221e;
    font-family:system-ui,-apple-system,sans-serif;
    display:grid;
    place-items:center;
    min-height:100vh
}

.box{
    width:min(390px,calc(100% - 32px));
    background:white;
    border:1px solid #dfe8e2;
    border-radius:22px;
    padding:28px;
    box-shadow:0 20px 70px #17382d12
}

.logo{
    font-size:27px;
    font-weight:900
}

.logo span{
    color:#2c755b
}

.muted{
    color:#718079;
    font-size:12px
}

form{
    display:grid;
    gap:10px;
    margin-top:22px
}

label{
    font-size:11px;
    font-weight:800
}

input,select{
    padding:12px;
    border:1px solid #dfe8e2;
    border-radius:11px;
    font-size:15px
}

button{
    padding:12px;
    border:0;
    border-radius:11px;
    background:#1d5a47;
    color:white;
    font-weight:800
}

.link{
    display:block;
    text-align:center;
    margin-top:16px;
    color:#1d5a47;
    text-decoration:none;
    font-size:12px
}

.error{
    margin-top:14px;
    padding:10px;
    border-radius:10px;
    background:#f7e6e3;
    color:#9b4038;
    font-size:12px
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
ORDER<span>FLOW</span>
</div>

<div class="muted">
Hospitality management platform
</div>

{% if error %}
<div class="error">{{error}}</div>
{% endif %}

<form method="post">

<label>Email</label>
<input
    type="email"
    name="email"
    required
    autocomplete="email"
>

<label>Password</label>
<input
    type="password"
    name="password"
    required
    autocomplete="current-password"
>

<button>
Sign in
</button>

</form>

<a class="link" href="/onboarding">
Create a new business
</a>

</div>

</body>
</html>
